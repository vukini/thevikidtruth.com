baseURL = "https://thevikidtruth.com/"
locale = "en"
title = "The VikiD Truth"
enableRobotsTXT = true

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[markup.goldmark.parser.attribute]
  block = true
  title = true
[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Start here"
    pageRef = "/start"
    weight = 5
  [[menus.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 10
  [[menus.main]]
    name = "Computing"
    pageRef = "/computing"
    weight = 20
  [[menus.main]]
    name = "Mathematics"
    pageRef = "/mathematics"
    weight = 30
  [[menus.main]]
    name = "Science"
    pageRef = "/science"
    weight = 40
  [[menus.main]]
    name = "Philosophy"
    pageRef = "/philosophy"
    weight = 45
  [[menus.main]]
    name = "Languages"
    pageRef = "/languages"
    weight = 50
  [[menus.main]]
    name = "Music"
    pageRef = "/music"
    weight = 60
  [[menus.main]]
    name = "Essays & Ideas"
    pageRef = "/essays"
    weight = 70
  [[menus.main]]
    name = "Frontier AI"
    pageRef = "/frontier-ai"
    weight = 75
  [[menus.main]]
    name = "Resources"
    pageRef = "/resources"
    weight = 80
  [[menus.main]]
    name = "VikiD"
    pageRef = "/vikid"
    weight = 85
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 90
[sitemap]
  changeFreq = "monthly"

[params]
  substack = "https://thevikidtruth.substack.com/"

[markup.highlight]
  noClasses = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    # Inline uses \( \) only: a single-$ delimiter would swallow prose prices
    # (e.g. "$1B ... $7B"). Block uses $$ only: Substack exports escape brackets
    # as \[ ... \], which would otherwise be parsed as display math.
    inline = [['\(', '\)']]
    block = [['$$', '$$']]
