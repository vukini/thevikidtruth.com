{{ define "head" }}<link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">{{ end }}
{{ define "main" }}<header class="ahead withart"><div class="ahead-text"><p class="crumb"><a href="{{ "/" | relURL }}">Home</a> / Search</p><h1>Search</h1><p class="sub">Look closer. VikiD sees through everything.</p></div>{{ partial "art.html" (dict "key" "search" "eager" true) }}</header><div id="search"></div>
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
<script>window.addEventListener('DOMContentLoaded',()=>new PagefindUI({element:"#search",showSubResults:true}));</script>
{{ end }}
