{% extends 'base.html' %}

{% block head %}
<title>Task Smash!</title>
{% endblock %}

{% block body %}
<div>
  {% if tasks|length < 1%}
    <h3>Insert a Task!</h3>
  {% else %}
    <form action="/" method="POST">
      <input type="text" name="content" id="content" />
      <input type="submit" name="Add Task" id="btn_add" />
    </form>
		      
		      
    <table class="content">
      <tr>
	<th>Tasks</th>
	<th>Added</th>
	<th>Actions</th>
      </tr>
      {% for task in tasks %}
      <tr>
	<td>{{task.content}}</td>
	<td>{{task.created.strftime("%Y-%m-%d")}}</td>
	<td>
	  <a href="/delete/{{task.id}}">Delete</a><a href="/update/{{task.id}}">Update</a>
	</td>
      </tr>
      {% endfor %}
    </table>
  {% endif %}
</div>

 {% endblock %}
